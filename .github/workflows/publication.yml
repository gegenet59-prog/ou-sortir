# Publie le site sur GitHub Pages à chaque modification,
# et retélécharge chaque lundi la liste des bars et clubs de France
name: Publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les bars et clubs de France
        run: python3 scripts/lieux_france.py || echo "On garde la liste déjà enregistrée"
        timeout-minutes: 45
      - name: Enregistrer la nouvelle liste dans le dépôt
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A data && git commit -m "Mise à jour des lieux de France [skip ci]" && git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
